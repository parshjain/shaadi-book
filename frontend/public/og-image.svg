<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#faf8f5"/>
  <!-- Pink and blue accents -->
  <rect width="600" height="4" fill="#F7B6C8"/>
  <rect x="600" width="600" height="4" fill="#5B7FA6"/>
  <rect y="626" width="600" height="4" fill="#F7B6C8"/>
  <rect x="600" y="626" width="600" height="4" fill="#5B7FA6"/>

  <!-- Title -->
  <text x="600" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="#1a1a2e">Baby Hasan Bets</text>

  <!-- Gold underline -->
  <rect x="500" y="250" width="90" height="3" rx="1.5" fill="#F7B6C8"/>
  <rect x="610" y="250" width="90" height="3" rx="1.5" fill="#5B7FA6"/>

  <!-- Subtitle -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="#4a4a5a">Anusha Kamal &amp; Alif Hasan</text>

  <!-- Description -->
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#8a8a9a">Live Prediction Markets for Baby Hasan</text>

