  <rect x="320" y="420" width="560" height="70" rx="12" fill="white" stroke="#e8e4df" stroke-width="1"/>
  <text x="360" y="462" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#1a1a2e">Gender?</text>
  <text x="750" y="455" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#5B7FA6">Boy 50¢</text>
  <text x="750" y="478" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#D76791">Girl 50¢</text>

  <!-- Footer badge -->
  <text x="600" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#5B7FA6">Baby Hasan gender reveal betting</text>
